<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsentry Labs - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Neural network canvas background */
        #neuralCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Subtle scan lines - very minimal */
        .scan-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 0, 0, 0.05) 3px
            );
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            max-width: 1000px;
        }

        /* Security badge/icon */
        .security-icon {
            margin-bottom: 40px;
            animation: pulse 3s ease-in-out infinite;
        }

        .shield {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            position: relative;
        }

        .shield-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(156, 163, 175, 0.4);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: shieldRotate 10s linear infinite;
        }

        .shield-inner {
            position: absolute;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(156, 163, 175, 0.15));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        @keyframes shieldRotate {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.05); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Title */
        .title {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #b0b0b0 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 8s ease infinite;
            line-height: 1.1;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Tagline */
        .tagline {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: #a0a0a0;
            font-weight: 400;
            letter-spacing: 0.08em;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        /* Terminal-like status text */
        .status-text {
            font-family: 'IBM Plex Mono', monospace;
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            color: #888888;
            margin-top: 40px;
            opacity: 0.9;
            animation: blink 1.5s step-end infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 0.8; }
            50%, 100% { opacity: 0.4; }
        }

        /* Decorative corner lines */
        .corner-accent {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 5;
            opacity: 0.4;
        }

        .corner-accent::before,
        .corner-accent::after {
            content: '';
            position: absolute;
            background: linear-gradient(135deg, #ffffff, #9ca3af);
        }

        .corner-accent.top-left {
            top: 30px;
            left: 30px;
        }

        .corner-accent.top-left::before {
            width: 2px;
            height: 100%;
            top: 0;
            left: 0;
        }

        .corner-accent.top-left::after {
            width: 100%;
            height: 2px;
            top: 0;
            left: 0;
        }

        .corner-accent.bottom-right {
            bottom: 30px;
            right: 30px;
        }

        .corner-accent.bottom-right::before {
            width: 2px;
            height: 100%;
            bottom: 0;
            right: 0;
        }

        .corner-accent.bottom-right::after {
            width: 100%;
            height: 2px;
            bottom: 0;
            right: 0;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .shield {
                width: 60px;
                height: 60px;
            }

            .security-icon {
                margin-bottom: 30px;
            }

            .subtitle {
                padding: 12px 24px;
                font-size: clamp(1rem, 4vw, 1.2rem);
            }

            .subtitle {
                padding: 12px 24px;
                font-size: clamp(1rem, 4vw, 1.2rem);
            }

            .corner-accent {
                width: 40px;
                height: 40px;
            }

            .corner-accent.top-left {
                top: 15px;
                left: 15px;
            }

            .corner-accent.bottom-right {
                bottom: 15px;
                right: 15px;
            }
        }

    </style>
</head>
<body>
    <!-- Background layers -->
    <canvas id="neuralCanvas"></canvas>
    <div class="scan-overlay"></div>

    <!-- Corner accents -->
    <div class="corner-accent top-left"></div>
    <div class="corner-accent bottom-right"></div>

    <!-- Main content -->
    <div class="container">
        <div class="security-icon">
            <div class="shield">
                <div class="shield-outer"></div>
                <div class="shield-inner"></div>
            </div>
        </div>
        
        <h1 class="title">Xsentry Labs</h1>
        <p class="tagline">Autonomous Security</p>
        <p class="status-text">&gt; coming_soon. stay_secure.</p>
    </div>

    <script>
        // Neural network visualization
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Resize canvas on window resize
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNodes();
        });

        // Node class
        class Node {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(180, 180, 180, 0.6)';
                ctx.fill();
            }
        }

        // Create nodes
        const nodes = [];
        const nodeCount = 80;

        function initNodes() {
            nodes.length = 0;
            for (let i = 0; i < nodeCount; i++) {
                nodes.push(new Node());
            }
        }

        initNodes();

        // Draw connections between close nodes
        function drawConnections() {
            const maxDistance = 150;

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        const opacity = (1 - distance / maxDistance) * 0.3;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(150, 150, 150, ${opacity})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, width, height);

            drawConnections();

            nodes.forEach(node => {
                node.update();
                node.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Subtle random glitch effect
        function randomGlitch() {
            const container = document.querySelector('.container');
            if (Math.random() > 0.98) {
                container.style.transform = `translate(${Math.random() * 2 - 1}px, ${Math.random() * 2 - 1}px)`;
                setTimeout(() => {
                    container.style.transform = 'translate(0, 0)';
                }, 30);
            }
        }

        setInterval(randomGlitch, 200);
    </script>
</body>
</html>
