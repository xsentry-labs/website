<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>products - xsentrylabs</title>
    <meta name="description" content="what we've built and what we maintain.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://xsentrylabs.com/products">

    <meta property="og:title" content="products - xsentrylabs">
    <meta property="og:description" content="what we've built and what we maintain.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://xsentrylabs.com/products">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav__inner">
            <a href="/" class="nav__brand">xsentrylabs</a>
            <div class="nav__links">
                <a href="/" class="nav__link">home</a>
                <a href="https://paperchat.xsentrylabs.com" target="_blank" rel="noopener noreferrer" class="nav__link">chat</a>
                <span class="nav__link nav__link--disabled">agent <span class="nav__badge">soon</span></span>
                <a href="/products.html" class="nav__link nav__link--active">products</a>
                <button class="nav__link" data-open-modal>contact</button>
            </div>
            <button class="theme-toggle" aria-label="Toggle theme">
                <svg class="theme-toggle__icon theme-toggle__icon--sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <svg class="theme-toggle__icon theme-toggle__icon--moon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M13.5 8.5a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="nav__toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main>
        <!-- Hero -->
        <section class="section section--hero" data-reveal>
            <div class="section__inner">
                <h1 class="hero__heading">products</h1>
                <p class="hero__sub">what we've built and what we maintain.</p>
            </div>
        </section>

        <div class="divider"></div>

        <!-- Product: paperchat -->
        <section class="section" data-reveal>
            <div class="section__inner">
                <span class="section__label">001</span>
                <h2 class="section__heading">paperchat</h2>
                <p class="section__text">
                    talk to research papers. upload a pdf, ask questions, get answers
                    grounded in the actual text. no hallucinated citations.
                </p>
                <a href="https://paperchat.xsentrylabs.com" target="_blank" rel="noopener noreferrer" class="contact__link">try paperchat</a>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal__backdrop"></div>
        <div class="modal__panel">
            <div class="modal__header">
                <h2 class="modal__title">pitch us your problem</h2>
                <button class="modal__close" aria-label="Close">&times;</button>
            </div>
            <form class="form" action="https://formspree.io/f/placeholder" method="POST">
                <div class="form__field">
                    <label class="form__label" for="name">name</label>
                    <input class="form__input" type="text" id="name" name="name" required autocomplete="name">
                </div>
                <div class="form__field">
                    <label class="form__label" for="email">email</label>
                    <input class="form__input" type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form__field">
                    <label class="form__label" for="phone">phone <span class="form__optional">optional</span></label>
                    <input class="form__input" type="tel" id="phone" name="phone" autocomplete="tel">
                </div>
                <div class="form__field">
                    <label class="form__label" for="project">what's the problem?</label>
                    <textarea class="form__input form__textarea" id="project" name="project" rows="4" required></textarea>
                </div>
                <button class="form__submit" type="submit">send</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__rule"></div>
        <div class="footer__inner">
            <div class="footer__col-title">products</div>
            <ul class="footer__links">
                <li><a href="https://paperchat.xsentrylabs.com" target="_blank" rel="noopener noreferrer">paperchat</a></li>
            </ul>
            <div class="footer__bottom">
                <span class="footer__copy"></span>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
